<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRR — BWT and RT ID</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1877f2;--blue-lt:#e7f3ff;--bg:#f0f2f5;--card:#fff;--text:#050505;--muted:#65676b;--border:#dde1e7;--green:#1a7f37;--green-lt:#e6f4ea;--red:#d93025;--red-lt:#fdecea;--amber:#b45309;--amber-lt:#fff4e0;--purple:#7c3aed;--font:'Inter','Padauk',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
.my{font-family:'Padauk',var(--font);font-size:11px;color:var(--muted);font-weight:400}
header{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header .logo{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
header h1{font-size:17px;margin:0;font-weight:800;line-height:1.2}
header h1 .my{color:#dbe7ff;display:block}
header .sp{flex:1}
.sync{background:#fff;color:var(--green);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.sync.warn{color:var(--amber)} .sync.err{color:var(--red)}
.who{display:flex;align-items:center;gap:6px;font-size:12px}
.who input{border:0;border-radius:8px;padding:6px 9px;font-family:var(--font);font-size:13px;width:130px}
nav{background:#fff;border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 10px;overflow-x:auto;position:sticky;top:58px;z-index:19}
nav button{border:0;background:none;padding:10px 14px 8px;font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;line-height:1.2}
nav button .my{display:block}
nav button.on{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:1180px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card-h{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-t{font-weight:800;font-size:14.5px}
.card-b{padding:12px 14px}
.sp{flex:1}
.btn{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:7px 12px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.btn:hover{background:#f5f6f7}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.on{background:var(--blue-lt);border-color:var(--blue);color:var(--blue)}
.in,select.in{border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--font);font-size:14px;background:#fff;width:100%}
.lbl{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.lbl .my{text-transform:none;letter-spacing:0}
.note{font-size:12px;color:var(--muted)}
.chip{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;background:#f0f2f5;color:#444;margin:1px 3px 1px 0}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* scan */
.scan-card{background:#fff;border:2px solid var(--blue);border-radius:14px;padding:18px 16px;box-shadow:0 4px 18px rgba(24,119,242,.12);text-align:center;margin-bottom:14px}
.scan-in{width:100%;font-size:26px;font-weight:800;text-align:center;padding:14px;border:2px solid var(--border);border-radius:12px;font-family:var(--font);outline:none;background:var(--bg)}
.scan-in:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(24,119,242,.15)}
.scan-in.ok{border-color:var(--green);background:var(--green-lt)}
.scan-in.bad{border-color:var(--red);background:var(--red-lt)}
.modes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.modes .btn{border-radius:20px}
.mode-opts{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
/* morph colours */
.m-BW{background:#e5e7eb;color:#111} .m-RED{background:#fde2e1;color:#b42318} .m-HA{background:#fff3d6;color:#8a5a00}
.m-AL{background:#fff7ed;color:#c2410c} .m-WH{background:#f8fafc;color:#334155;border:1px solid #cbd5e1} .m-HB{background:#1f2937;color:#fff} .m-NO{background:#f0f2f5;color:#888}
/* profile */
.prof{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:14px}
@media(max-width:760px){.prof{grid-template-columns:1fr}}
.pid{font-size:34px;font-weight:800;line-height:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:12px;font-size:13.5px}
.facts b{color:var(--muted);font-weight:700;font-size:12px}
.act{margin-bottom:12px}
.act .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tl{border-left:3px solid var(--border);margin-left:6px;padding-left:12px}
.tl .e{position:relative;padding:4px 0 8px;font-size:13px}
.tl .e:before{content:'';position:absolute;left:-18px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.tl .e .t{font-size:11px;color:var(--muted)}
.dead{opacity:.55}
/* tables */
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:#f7f8fa;text-align:left;padding:7px 8px;font-size:11px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f3;vertical-align:middle}
table.t tr.click{cursor:pointer} table.t tr.click:hover{background:#f7faff}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.tile .v{font-size:26px;font-weight:800}
.tile .l{font-size:11.5px;font-weight:700;color:var(--muted)}
.bars .r{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bars .b{background:#f0f2f5;border-radius:6px;height:14px;overflow:hidden;display:flex}
.bars .b i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
/* map */
.mapwrap{overflow:auto;background:#fff}
.mapwrap svg{display:block;width:100%;height:auto;min-width:640px}
.reg{cursor:pointer}
.reg rect{shape-rendering:crispEdges}
.reg:hover rect{fill-opacity:.7}
.reg.sel rect{fill:#ffd54f}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px;border:1px solid #ccc}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:10px;font-weight:700;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)}
.recent{max-height:260px;overflow:auto;text-align:left;margin-top:12px}
.recent div{padding:5px 8px;border-bottom:1px solid #eef0f3;font-size:13px;display:flex;gap:8px;align-items:center}
.problem{background:var(--red-lt);color:var(--red);padding:8px 14px;font-weight:700;font-size:13px;display:none}
</style>
</head>
<body>
<header>
  <div class="logo">🦎</div>
  <h1>BWT and RT ID · SRR<span class="my">တီဂူ မှတ်ပုံတင်ခြင်း</span></h1>
  <span class="sp"></span>
  <div class="who">👤 <input id="who" placeholder="Your name · အမည်" onchange="setWho(this.value)"></div>
  <span class="sync" id="sync">…</span>
</header>
<div class="problem" id="problem"></div>
<nav>
  <button id="tab-scan" onclick="tab('scan')">📷 Scan<span class="my">စကင်ဖတ်</span></button>
  <button id="tab-map" onclick="tab('map')">🗺️ Map<span class="my">မြေပုံ</span></button>
  <button id="tab-list" onclick="tab('list')">🦎 Animals<span class="my">တိရစ္ဆာန်များ</span></button>
  <button id="tab-stats" onclick="tab('stats')">📊 Summary<span class="my">အနှစ်ချုပ်</span></button>
  <button id="tab-breed" onclick="tab('breed')">💕 Breeding<span class="my">မိတ်လိုက်ခြင်း</span></button>
  <button id="tab-log" onclick="tab('log')">📋 Log<span class="my">မှတ်တမ်း</span></button>
</nav>
<main id="main"></main>

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function pad(n){ return ('0' + n).slice(-2); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today(){ return ymd(new Date()); }
function nowStr(){ var d = new Date(); return ymd(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function addDays(s, n){ var p = s.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2] + n); return ymd(d); }
function niceDate(s){ if(!s) return '—'; var p = String(s).slice(0, 10).split('-'); return +p[2] + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1] - 1] + (p[0] != new Date().getFullYear() ? ' ' + p[0] : ''); }
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function toast(msg, kind){ var t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2300); }
function who(){ return (document.getElementById('who').value || '').trim(); }
function setWho(v){ try{ localStorage.setItem('srr_tegu_who', v); }catch(e){} }
function needWho(){ var n = who(); if(!n){ toast('Type your name at the top first · အမည် ရေးပါ', 'err'); document.getElementById('who').focus(); } return n; }

// ── animals ──
function animal(id){
  id = String(id);
  if(DB[id]) return DB[id];
  if(BASE[id]) return { id:id, cage:BASE[id], morph:'', sex:'', w:null, wDate:'', status:'alive', health:'ok', seen:'', notes:'', ev:[], fresh:true };
  return null;
}
function allAnimals(){
  var m = {}; Object.keys(BASE).forEach(function(id){ m[id] = animal(id); });
  Object.keys(DB).forEach(function(id){ m[id] = DB[id]; });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a, b){ return (+a.id || 1e9) - (+b.id || 1e9) || (a.id < b.id ? -1 : 1); });
}
function alive(a){ return a.status !== 'dead' && a.status !== 'sold'; }
function morphChip(k){ var m = MORPH[k]; return '<span class="chip m-' + (m ? k : 'NO') + '">' + (m ? esc(m.en) : 'morph not set') + '</span>'; }
function sexTxt(s){ return s === 'M' ? '♂ Male' : s === 'F' ? '♀ Female' : '? Unknown'; }
function sexIcon(s){ return s === 'M' ? '<b style="color:#1877f2">♂</b>' : s === 'F' ? '<b style="color:#d6336c">♀</b>' : '<span style="color:#aaa">?</span>'; }
function healthChip(a){
  if(a.status === 'dead') return '<span class="chip" style="background:#111;color:#fff">💀 Died ' + niceDate(a.outDate) + '</span>';
  if(a.status === 'sold') return '<span class="chip" style="background:#e0e7ff;color:#3730a3">💰 Sold ' + niceDate(a.outDate) + '</span>';
  if(a.health === 'sick') return '<span class="chip" style="background:var(--red-lt);color:var(--red)">🤒 Sick</span>';
  if(a.health === 'injury') return '<span class="chip" style="background:var(--amber-lt);color:var(--amber)">🩹 Injury</span>';
  return '<span class="chip" style="background:var(--green-lt);color:var(--green)">✅ Healthy</span>';
}
var EV_TXT = { morph:'🎨 Morph', sex:'⚥ Sex', weight:'⚖️ Weight', move:'📍 Moved', health:'❤️ Health', death:'💀 Died', sold:'💰 Sold', note:'📝 Note', seen:'👁️ Checked', undo:'↩️ Undo' };
function evText(e){
  if(e.type === 'morph') return 'Morph: <b>' + esc(MORPH[e.v] ? MORPH[e.v].en : e.v || '—') + '</b>';
  if(e.type === 'sex') return 'Sex: <b>' + sexTxt(e.v) + '</b>';
  if(e.type === 'weight') return 'Weight: <b>' + esc(e.v) + ' g</b>';
  if(e.type === 'move') return 'Moved <b>' + esc(e.from || '?') + ' → ' + esc(e.v) + '</b>';
  if(e.type === 'health') return 'Health: <b>' + ({ ok:'✅ Healthy', sick:'🤒 Sick', injury:'🩹 Injury' }[e.v] || esc(e.v)) + '</b>';
  if(e.type === 'death') return '<b>💀 Died</b>';
  if(e.type === 'sold') return '<b>💰 Sold</b>';
  if(e.type === 'seen') return 'Checked — seen OK';
  return '';
}

// One change to one animal → update it, add to its history, send to the Sheet
function change(id, type, v, note, date){
  var n = needWho(); if(!n) return false;
  var a = JSON.parse(JSON.stringify(animal(id) || { id:String(id), cage:'', morph:'', sex:'', w:null, wDate:'', status:'alive', health:'ok', seen:'', notes:'', ev:[] }));
  delete a.fresh;
  var d = date || today();
  var e = { id:'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), type:type, v:v, d:d, t:nowStr(), by:n };
  if(note) e.note = note;
  if(type === 'morph') a.morph = v;
  else if(type === 'sex') a.sex = v;
  else if(type === 'weight'){ if(!a.wDate || d >= a.wDate){ a.w = num(v); a.wDate = d; } }
  else if(type === 'move'){ e.from = a.cage; a.cage = v; }
  else if(type === 'health'){ a.health = v; }
  else if(type === 'death'){ a.status = 'dead'; a.outDate = d; }
  else if(type === 'sold'){ a.status = 'sold'; a.outDate = d; }
  else if(type === 'alive'){ a.status = 'alive'; a.outDate = ''; e.type = 'undo'; }
  else if(type === 'note'){ a.notes = v; }
  e.cage = a.cage;
  a.seen = d > (a.seen || '') ? d : a.seen;
  a.ev = (a.ev || []).concat([e]);
  a.updatedAt = Date.now();
  DB[a.id] = a;
  PENDING.push({ animal:a, event:e });
  persist(); pushPending();
  return true;
}

// ── storage & sync ──
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({ db:DB, pairs:PAIRS, pending:PENDING, last:LAST_SYNC })); }catch(e){ console.warn('storage full', e); } }
function restore(){ try{ var o = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if(o){ DB = o.db || {}; PAIRS = o.pairs || {}; PENDING = o.pending || []; LAST_SYNC = o.last || 0; } }catch(e){} try{ document.getElementById('who').value = localStorage.getItem('srr_tegu_who') || ''; }catch(e){} }
function setSync(txt, cls){ var s = document.getElementById('sync'); s.textContent = txt; s.className = 'sync ' + (cls || ''); }
function problem(msg){ var p = document.getElementById('problem'); p.style.display = msg ? 'block' : 'none'; p.textContent = msg ? '⚠️ ' + msg : ''; }
function api(body){
  if(!SHEET_URL) return Promise.reject(new Error('No Sheet link yet (SHEET_URL is empty) — data stays on this device.'));
  var q = JSON.stringify(body), url = SHEET_URL + '?payload=' + encodeURIComponent(q) + '&t=' + Date.now();
  var p = url.length < 7000 ? fetch(url) : fetch(SHEET_URL, { method:'POST', body:q });
  return p.then(function(r){ return r.text(); }).then(function(t){
    var j; try{ j = JSON.parse(t); }catch(e){ throw new Error(/sign in|accounts\.google/i.test(t) ? 'Google asked for a sign-in — deployment must be "Who has access: Anyone"' : 'The Sheet script sent an error page'); }
    if(!j.version || String(j.version) < NEED_SCRIPT_VERSION) throw new Error('The Sheet script is out of date — Deploy → Manage deployments → ✎ Edit → New version');
    if(!j.ok) throw new Error(j.error || 'Sheet error');
    return j;
  });
}
var pushing = false;
function pushPending(){
  if(pushing || !PENDING.length) { updSync(); return; }
  pushing = true; setSync('⏳ Saving ' + PENDING.length + '…', 'warn');
  var item = PENDING[0];
  (item.pair ? api({ action:'savePair', pair:item.pair }) : api({ action:'save', animal:item.animal, event:item.event })).then(function(){
    PENDING.shift(); persist(); pushing = false; problem(''); pushPending();
  }).catch(function(err){ pushing = false; problem(err.message + ' (' + PENDING.length + ' not sent yet — they are kept and will retry)'); updSync(); setTimeout(pushPending, 30000); });
}
function updSync(){ if(PENDING.length) setSync('⏳ ' + PENDING.length + ' to send', 'warn'); else if(!SHEET_URL) setSync('📴 Not linked', 'err'); else setSync('✅ Synced ' + (LAST_SYNC ? new Date(LAST_SYNC).toTimeString().slice(0, 5) : ''), ''); }
function pull(){
  if(!SHEET_URL) { updSync(); return; }
  api({ action:'list', since:LAST_SYNC ? LAST_SYNC - 60000 : 0 }).then(function(j){
    var pendIds = {}, pendP = {}; PENDING.forEach(function(p){ if(p.pair) pendP[p.pair.id] = 1; else pendIds[p.animal.id] = 1; });
    (j.pairs || []).forEach(function(x){ if(pendP[x.id]) return; if(!PAIRS[x.id] || num(x.updatedAt) >= num(PAIRS[x.id].updatedAt)) PAIRS[x.id] = x; });
    (j.animals || []).forEach(function(a){ if(pendIds[a.id]) return; if(!DB[a.id] || num(a.updatedAt) >= num(DB[a.id].updatedAt)) DB[a.id] = a; });
    LAST_SYNC = j.now || Date.now(); persist(); updSync(); problem('');
    if(CUR !== 'scan' && !(CUR === 'breed' && PEDIT)) render(); else if(SEL) renderProfile();
  }).catch(function(err){ problem(err.message); updSync(); });
}

    '<div class="filters">' +
      '<div><span class="lbl">Date laid · <span class="my">ဥချသည့်ရက်</span></span><input class="in" type="date" id="b-laid" value="' + esc(e.laid) + '" max="' + t + '"></div>' +
      '<div><span class="lbl">Eggs laid · <span class="my">ဥ အရေအတွက်</span></span><input class="in" type="number" min="0" id="b-eggs" value="' + esc(e.eggs) + '"></div>' +
      '<div><span class="lbl">Good eggs · <span class="my">ဥကောင်း</span></span><input class="in" type="number" min="0" id="b-good" value="' + esc(e.good) + '"></div>' +
      '<div><span class="lbl">Hatch date · <span class="my">ပေါက်သည့်ရက်</span></span><input class="in" type="date" id="b-hd" value="' + esc(e.hatchDate) + '" max="' + t + '"></div>' +
      '<div><span class="lbl">Hatched · <span class="my">ပေါက်သည့် အရေအတွက်</span></span><input class="in" type="number" min="0" id="b-hn" value="' + esc(e.hatched) + '"></div>' +
    '</div>' +
    '<div style="margin-top:10px"><span class="lbl">Notes · <span class="my">မှတ်ချက်</span></span><input class="in" id="b-notes" value="' + esc(e.notes || '') + '" placeholder="optional"></div>' +
    '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" onclick="bSave()">💾 Save · သိမ်းမည်</button>' + (e.id ? '<button class="btn" onclick="bDelete()">🗑 Delete</button>' : '') + '</div>' +
  '</div></div>';
  // list
  var Q = PQ.replace(/\D/g, ''), L = P.filter(function(p){ return !Q || p.male === Q || p.female === Q; });
  h += '<div class="card"><div class="card-h"><span class="card-t">📋 Pairings · <span class="my">မိတ်လိုက်မှု စာရင်း</span> (' + L.length + ')</span><span class="sp"></span><input class="in" style="width:170px" placeholder="find tegu # · ရှာ" value="' + esc(PQ) + '" oninput="PQ=this.value;renderBreedList()"></div><div id="b-list"></div></div>';
  // morph combos
  var combo = {};
  P.forEach(function(p){ var m = animal(p.male), f = animal(p.female); var k = (m && MORPH[m.morph] ? MORPH[m.morph].en : '?') + ' ♂ × ' + (f && MORPH[f.morph] ? MORPH[f.morph].en : '?') + ' ♀';
    var x = combo[k] || (combo[k] = { n:0, eggs:0, good:0, hatched:0, hEggs:0 }); x.n++; x.eggs += num(p.eggs); x.good += num(p.good); if(p.hatchDate){ x.hatched += num(p.hatched); x.hEggs += num(p.good || p.eggs); } });
  var ck = Object.keys(combo).sort(function(a, b){ return combo[b].n - combo[a].n; });
  if(ck.length) h += '<div class="card"><div class="card-h"><span class="card-t">🎨 Results by morph pairing · <span class="my">မော့ဖ် အတွဲအလိုက်</span></span></div><div class="tw"><table class="t"><thead><tr><th>Pairing</th><th>Pairs</th><th>Eggs</th><th>Good</th><th>Hatched</th><th>Hatch rate</th></tr></thead><tbody>' +
    ck.map(function(k){ var x = combo[k]; return '<tr><td><b>' + esc(k) + '</b></td><td>' + x.n + '</td><td>' + x.eggs + '</td><td>' + x.good + '</td><td>' + x.hatched + '</td><td>' + (x.hEggs ? pct(x.hatched, x.hEggs) + '%' : '—') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  document.getElementById('main').innerHTML = h;
  pairPreview(); renderBreedList();
}
function renderBreedList(){
  var Q = PQ.replace(/\D/g, ''), L = allPairs().filter(function(p){ return !Q || p.male === Q || p.female === Q; }), b = document.getElementById('b-list'); if(!b) return;
  b.innerHTML = L.length ? '<div class="tw"><table class="t"><thead><tr><th>Paired</th><th>♂ Male</th><th>♀ Female</th><th>Cage</th><th>Laid</th><th>Eggs / good</th><th>Hatched</th><th>Status</th></tr></thead><tbody>' +
    L.map(function(p){
      var st = p.hatchDate ? '<span class="chip" style="background:#f3e8ff;color:#7c3aed">🐣 hatched</span>' : num(p.eggs) ? '<span class="chip" style="background:var(--amber-lt);color:var(--amber)">🥚 incubating' + (p.laid ? ' · ' + Math.round((new Date(today()) - new Date(p.laid)) / 864e5) + ' d' : '') + '</span>' : '<span class="chip" style="background:#fde2e1;color:#d6336c">💕 paired</span>';
      return '<tr class="click" onclick="bEdit(\'' + p.id + '\')"><td>' + niceDate(p.date) + '</td><td>' + tagLine(p.male) + '</td><td>' + tagLine(p.female) + '</td><td>' + esc(p.cage || '') + '</td><td>' + (p.laid ? niceDate(p.laid) : '—') + '</td><td>' + (num(p.eggs) ? p.eggs + ' / ' + (p.good === '' || p.good == null ? '?' : p.good) : '—') + '</td><td>' + (p.hatchDate ? '<b>' + num(p.hatched) + '</b>' + (num(p.good || p.eggs) ? ' (' + pct(num(p.hatched), num(p.good || p.eggs)) + '%)' : '') : '—') + '</td><td>' + st + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">No pairings yet · မရှိသေး</div>';
}
function bEdit(id){ PEDIT = JSON.parse(JSON.stringify(PAIRS[id])); renderBreed(); window.scrollTo(0, 0); }
function bVal(id){ return (document.getElementById(id).value || '').trim(); }
function bSave(){
  var m = cleanId(bVal('b-m')), f = cleanId(bVal('b-f'));
  if(!m || !f){ toast('Scan or type the male and the female · အထီး နှင့် အမ ရေးပါ', 'err'); return; }
  if(m === f){ toast('Male and female are the same number', 'err'); return; }
  if(!animal(m) || !animal(f)){ toast('Tegu number not found', 'err'); return; }
  var am = animal(m), af = animal(f);
  if((am.sex === 'F' || af.sex === 'M') && !confirm('The sexes look swapped (♂ #' + m + ' is ' + sexTxt(am.sex) + ', ♀ #' + f + ' is ' + sexTxt(af.sex) + '). Save anyway? · ဆက်သိမ်းမလား?')) return;
  var eggs = bVal('b-eggs'), good = bVal('b-good');
  if(eggs !== '' && good !== '' && num(good) > num(eggs)){ toast('Good eggs is more than eggs laid', 'err'); return; }
  var p = PEDIT && PEDIT.id ? PEDIT : { id:'P' + Date.now().toString(36) };
  p.date = bVal('b-date') || today(); p.male = m; p.female = f; p.cage = bVal('b-cage');
  p.laid = bVal('b-laid'); p.eggs = eggs; p.good = good; p.hatchDate = bVal('b-hd'); p.hatched = bVal('b-hn'); p.notes = bVal('b-notes'); p.deleted = false;
  if(!savePair(p)) return;
  // unknown sex? set it from the pairing
  if(!am.sex) change(m, 'sex', 'M', 'From pairing with #' + f);
  if(!af.sex) change(f, 'sex', 'F', 'From pairing with #' + m);
  PEDIT = null; toast('💾 Pairing saved · သိမ်းပြီး', 'ok'); renderBreed();
}
function bDelete(){ if(!PEDIT || !confirm('Delete this pairing? · ဖျက်မလား?')) return; var p = PEDIT; p.deleted = true; if(savePair(p)){ PEDIT = null; renderBreed(); } }
function breedHtml(id){
  var L = pairsOf(id); if(!L.length) return '';
  return '<span class="lbl" style="margin-top:12px">💕 Bred with · <span class="my">မိတ်လိုက်ဖူးသူ</span></span><div style="margin-bottom:12px">' + L.map(function(p){
    var other = p.male === String(id) ? p.female : p.male;
    return '<div style="padding:4px 0;font-size:13px;cursor:pointer" onclick="tab(\'breed\');bEdit(\'' + p.id + '\')">' + niceDate(p.date) + ' — ' + (p.male === String(id) ? '♀ ' : '♂ ') + tagLine(other) + (num(p.eggs) ? ' · 🥚 ' + p.eggs + (p.hatchDate ? ' · 🐣 ' + num(p.hatched) : '') : '') + '</div>';
  }).join('') + '</div>';
}

// ── start ──
restore(); tab('scan'); updSync(); pull(); pushPending();
setInterval(function(){ pull(); pushPending(); }, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) pull(); });
</script>
</body>
